[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "file-ez-mgr"
version = "0.1.0"
description = "A cross-platform, tabbed PyQt5 file transfer client"
requires-python = ">=3.10"
dependencies = ["PyQt5>=5.15.11,<5.16", "paramiko>=3.5,<5", "tftpy>=0.8.6,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyftpdlib>=2,<3", "pyinstaller>=6,<7"]

[project.scripts]
file-ez = "file_ez_mgr.app:main"

[tool.setuptools.packages.find]
include = ["file_ez_mgr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
